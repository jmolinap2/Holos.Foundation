name: Publicar paquetes en nuget.org

# Se publica al subir una etiqueta v<versión>, p. ej.: git tag v0.1.0 && git push origin v0.1.0
# Autenticación: Trusted Publishing de nuget.org (sin clave almacenada).
# Configuración única en nuget.org -> Trusted Publishing -> Create:
#   Repository Owner: jmolinap2   Repository: Holos.Foundation   Workflow File: publish.yml   Environment: (vacío)
# y la variable de repositorio NUGET_USER con el nombre de usuario de nuget.org dueño de la política.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Versión desde la etiqueta
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet test --nologo
      - run: dotnet pack -c Release -p:Version="$VERSION" -o nupkg --nologo
      - name: Login en NuGet (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publicar
        run: dotnet nuget push "nupkg/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
