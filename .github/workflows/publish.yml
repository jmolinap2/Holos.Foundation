name: Publicar paquetes en nuget.org

# Se publica al subir una etiqueta v<versión>, p. ej.: git tag v0.1.0 && git push origin v0.1.0
# Requiere el secreto NUGET_API_KEY (permiso push, glob Holos.Foundation.*).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Versión desde la etiqueta
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet test --nologo
      - run: dotnet pack -c Release -p:Version="$VERSION" -o nupkg --nologo
      - name: Publicar
        env:
          KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::Falta NUGET_API_KEY"; exit 1; }
          dotnet nuget push "nupkg/*.nupkg" --api-key "$KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
